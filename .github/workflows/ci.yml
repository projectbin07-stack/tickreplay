name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest --cov=tickreplay --cov-report=term-missing --cov-fail-under=90
      - name: CLI smoke test (synthetic data)
        shell: bash
        run: |
          tickreplay --version
          tickreplay gen --model ou --seed 7 --bars 400 --out smoke.csv
          tickreplay run --strategy donchian --data smoke.csv --report smoke.html --fee-bps 5
          tickreplay paper --strategy sma --data smoke.csv --speed 0
          test -s smoke.html
