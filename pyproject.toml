[build-system]
requires = ["hatchling>=1.24,<2"]
build-backend = "hatchling.build"

[project]
name = "tickreplay"
version = "0.1.1"
description = "Deterministic event-driven backtesting and paper-trading research engine in pure Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Navaneeth KG" }]
keywords = ["backtesting", "paper-trading", "event-driven", "simulation", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.17.5,<0.18",
    "mypy>=2.4,<3",
]

[project.scripts]
tickreplay = "tickreplay.cli:main"

[project.urls]
Homepage = "https://github.com/projectbin07-stack/tickreplay"
Issues = "https://github.com/projectbin07-stack/tickreplay/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tickreplay"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.coverage.run]
source = ["tickreplay"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "\\.\\.\\."]
